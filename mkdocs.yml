site_name: IT Support Knowledge Base
site_description: A troubleshooting knowledge base for L1 IT Help Desk support.
site_author: Robert Oprisan
site_url: https://robertoprr.github.io/KnowledgeBase/
repo_url: https://github.com/RobertOprr/KnowledgeBase
repo_name: RobertOprr/KnowledgeBase
edit_uri: edit/main/docs/
copyright: "&copy; 2026 Robert Oprisan"

theme:
  name: material
  custom_dir: overrides
  icon:
    logo: material/lifebuoy
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/hero-search.js

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ro
          name: Română
          build: true
          site_name: Baza de cunoștințe pentru suport IT
          site_description: O bază de cunoștințe pentru depanare, destinată suportului IT de nivel 1 (L1).
          nav_translations:
            Home: Acasă
            Accounts: Conturi
            Network: Rețea
            Hardware: Hardware
            Printers: Imprimante
            Email: Email
            Process: Proces
            Password Reset & Account Lockout: Resetare parolă și blocare cont
            MFA Issues: Probleme de autentificare multi-factor (MFA)
            Wi-Fi & Network Connectivity: Conectivitate Wi-Fi și rețea
            VPN Connection Issues: Probleme de conexiune VPN
            Computer Won't Boot: Calculatorul nu pornește
            Slow Computer Performance: Performanță scăzută a calculatorului
            Peripheral Not Detected: Periferic nedetectat
            Blue Screen of Death (BSOD): Ecran albastru (BSOD)
            Software: Software
            Software Won't Install or Crashes: Software-ul nu se instalează sau se blochează
            Printer Not Printing: Imprimanta nu printează
            Outlook Sync Problems: Probleme de sincronizare Outlook
            Security: Securitate
            Malware or Virus Infection: Infecție cu malware sau virus
            Shared Drive and File Permissions: Unitate partajată și permisiuni fișiere
            Escalation Criteria (L1 to L2): Criterii de escaladare (L1 către L2)
  - git-revision-date-localized:
      type: date
      enable_creation_date: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Accounts:
      - Password Reset & Account Lockout: accounts/password-reset-account-lockout.md
      - MFA Issues: accounts/mfa-issues.md
  - Network:
      - Wi-Fi & Network Connectivity: network/wifi-connectivity-troubleshooting.md
      - VPN Connection Issues: network/vpn-connection-issues.md
      - Shared Drive and File Permissions: network/shared-drive-permissions.md
  - Hardware:
      - Computer Won't Boot: hardware/computer-wont-boot.md
      - Slow Computer Performance: hardware/slow-computer-performance.md
      - Peripheral Not Detected: hardware/peripheral-not-detected.md
      - Blue Screen of Death (BSOD): hardware/blue-screen-of-death.md
  - Software:
      - Software Won't Install or Crashes: software/software-install-crash.md
  - Printers:
      - Printer Not Printing: printers/printer-not-printing.md
  - Email:
      - Outlook Sync Problems: email/outlook-sync-issues.md
  - Security:
      - Malware or Virus Infection: security/malware-virus-infection.md
  - Process:
      - "Escalation Criteria (L1 to L2)": process/escalation-criteria.md
